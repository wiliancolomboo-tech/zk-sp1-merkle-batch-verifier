[package]
name = "zk-sp1-merkle-batch-verifier"
version = "0.1.0"
edition = "2021"
description = "SP1 ZK-Coprocessor: High-Throughput Merkle Batch Verifier CLI"
license = "MIT"

[dependencies]
ark-bn254 = "0.4.0"
ark-ff = "0.4.0"
ark-groth16 = "0.4.0"
ark-snark = "0.4.0"
clap = { version = "4.4", features = ["derive"] }
num-bigint = { version = "0.4", features = ["rand"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
